<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z" fill="currentColor"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" fill="currentColor"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4z" fill="currentColor"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM9 6a3 3 0 016 0v2H9z" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.93 6h-2.95a15.65 15.65 0 00-1.38-3.56A8.03 8.03 0 0118.93 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14a8.2 8.2 0 010-4h3.38a16.5 16.5 0 000 4zm.81 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 015.07 16zm2.95-8H5.07a7.99 7.99 0 014.33-3.56A15.65 15.65 0 008.02 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66a14.7 14.7 0 010-4h4.68a14.7 14.7 0 010 4zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 01-4.33 3.56zM16.36 14a16.5 16.5 0 000-4h3.38a8.2 8.2 0 010 4z" fill="currentColor"/></symbol>
    <symbol id="i-logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M8 28q8-8 16 0t16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M8 20q8-8 16 0t16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" class="icon-btn small" title="New tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
  </div>
  <div id="toolbar">
    <button id="back" class="icon-btn" title="Back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <button id="forward" class="icon-btn" title="Forward" aria-label="Forward"><svg><use href="#i-forward"/></svg></button>
    <button id="reload" class="icon-btn" title="Reload" aria-label="Reload"><svg><use href="#i-reload"/></svg></button>
    <button id="home" class="icon-btn" title="Home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
    <div id="omnibox">
      <svg class="omni-icon"><use href="#i-search"/></svg>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
    </div>
  </div>
  <div id="content">
    <div id="newtab-page">
      <svg class="logo"><use href="#i-logo"/></svg>
      <h1>Mirage</h1>
      <form id="ntp-form">
        <svg class="omni-icon"><use href="#i-search"/></svg>
        <input id="ntp-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      </form>
      <div id="shortcuts"></div>
    </div>
    <div id="frames"></div>
  </div>
  <div id="status" hidden></div>
</div>

<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script src="/app.js"></script>
</body>
</html>
