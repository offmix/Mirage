<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage</title>
<script>
try{var s=JSON.parse(localStorage.getItem("mirage:settings")||"{}");var t=s.theme||"system";
if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t;document.documentElement.dataset.accent=s.accent||"blue";
if(s.tab){if(s.tab.title)document.title=s.tab.title;if(s.tab.icon){var l=document.createElement("link");l.id="mirage-icon";l.rel="icon";l.href=s.tab.icon;document.head.appendChild(l);}}
}catch(e){}
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM9 6a3 3 0 016 0v2H9z" fill="currentColor"/></symbol>

    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></symbol>

    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/></symbol>

    <symbol id="i-logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M8 28q8-8 16 0t16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M8 20q8-8 16 0t16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" class="icon-btn small" title="New tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
  </div>
  <nav id="bookmark-bar" aria-label="ブックマークバー"></nav>
  <div id="toolbar">
    <button id="back" class="icon-btn" title="Back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <button id="forward" class="icon-btn" title="Forward" aria-label="Forward"><svg><use href="#i-forward"/></svg></button>
    <button id="reload" class="icon-btn" title="Reload" aria-label="Reload"><svg><use href="#i-reload"/></svg></button>
    <button id="home" class="icon-btn" title="Home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
    <div id="omnibox">
      <svg class="omni-icon"><use href="#i-search"/></svg>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      <button id="star" class="omni-btn" title="このページをブックマーク" aria-label="このページをブックマーク"><svg><use href="#i-star"/></svg></button>
    </div>
    <button id="btn-sidebar" class="icon-btn" title="ブックマークと履歴" aria-label="ブックマークと履歴"><svg><use href="#i-bookmark"/></svg></button>
    <button id="btn-settings" class="icon-btn" title="設定" aria-label="設定"><svg><use href="#i-settings"/></svg></button>
    <button id="btn-account" class="icon-btn avatar-btn" title="アカウント" aria-label="アカウント"><span id="avatar-slot"><svg><use href="#i-person"/></svg></span></button>
    <button id="btn-fullscreen" class="icon-btn" type="button" title="サイトを全画面表示" aria-label="サイトを全画面表示" aria-pressed="false" disabled><svg><use href="#i-fullscreen"/></svg></button>
  </div>
  <div id="main">
  <div id="content">
    <div id="newtab-page">
      <img class="wordmark" src="/mirage-logo.svg" alt="Mirage">
      <form id="ntp-form">
        <svg class="omni-icon"><use href="#i-search"/></svg>
        <input id="ntp-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      </form>
      <div id="shortcuts"></div>
    </div>
    <div id="frames"></div>
    <button id="fullscreen-exit" type="button" title="全画面を終了" aria-label="全画面を終了"><svg><use href="#i-exit-fullscreen"/></svg></button>
    <div id="privacy-filter" hidden></div>
  </div>
  <aside id="sidebar" hidden></aside>
  </div>
  <div id="status" hidden></div>
</div>

<div id="tab-lock" class="tab-lock" hidden role="dialog" aria-modal="true" aria-labelledby="tab-lock-title">
  <div class="tab-lock-card">
    <div class="lock-mark" id="tab-lock-mark" aria-hidden="true"><svg><use href="#i-lock"/></svg></div>
    <h1 id="tab-lock-title">Mirage はロック中です</h1>
    <p>続けるにはパスワードを入力してください。</p>
    <form id="tab-lock-form">
      <label class="sr-only" for="tab-lock-password">パスワード</label>
      <input id="tab-lock-password" name="password" type="password" minlength="3" required autocomplete="current-password" placeholder="パスワード">
      <button class="btn primary" type="submit">ロックを解除</button>
      <p id="tab-lock-message" class="lock-message" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<dialog id="dlg-settings"></dialog>
<dialog id="dlg-account"></dialog>

<script src="/config.js"></script>
<script src="/supabase/supabase.js"></script>
<script src="/baremux/index.js"></script>
<script src="/data.js"></script>
<script src="/ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
